name: Generate Contribution Snake

on:
  schedule:
    # Run every 12 hours (at 00:00 and 12:00 UTC)
    - cron: "0 */12 * * *"
  
  # Allows manual triggering anytime via the GitHub Actions tab
  workflow_dispatch:
  
  # Trigger on pushes to the main branch
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Contribution Grid Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg?color_snake=#39d353
            assets/github-snake-dark.svg?palette=github-dark&color_snake=#39d353

      - name: Commit and Push Generated Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake.svg assets/github-snake-dark.svg
          git diff --staged --quiet || (git commit -m "chore(snake): update contribution snake animation" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
